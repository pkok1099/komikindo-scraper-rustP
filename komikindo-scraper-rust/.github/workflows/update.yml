# KomikIndo Smart Update — runs every 6 hours
#
# Flow:
#   1. Build Rust binary (release, statically linked curl)
#   2. Restore DB from data branch
#   3. Run `komikindo-scraper update`
#   4. Push updated DB to data branch
#
# DB storage: dedicated `data` branch containing only data/komik_db.jsonl
# This keeps the main branch clean and avoids bloating git history.

name: Smart Update

on:
  schedule:
    # Every 6 hours (UTC) = 07:00, 13:00, 19:00, 01:00 WIB
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_LOG: warn
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # ── Checkout source code ──
      - uses: actions/checkout@v4

      # ── Rust toolchain ──
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Generate Cargo.lock if missing ──
      - name: Generate Cargo.lock
        run: cargo generate-lockfile 2>/dev/null || true

      # ── Cache cargo (build time ~2min without cache, ~30s with) ──
      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Build dependencies ──
      # static-curl + static-ssl + tls-rustls = no system dependencies needed!
      # curl: vendored OpenSSL compiled from source (no libssl-dev needed)
      # sqlx: rustls for TLS (no native-tls/OpenSSL needed)
      - name: Install build dependencies
        run: echo "No system dependencies needed (vendored OpenSSL + rustls)"

      # ── Build release binary ──
      # Strip + LTO already configured in Cargo.toml [profile.release]
      - name: Build
        run: cargo build --release 2>&1

      # ── Restore DB from data branch ──
      # The `data` branch stores only data/komik_db.jsonl.
      # If branch doesn't exist yet, start with empty DB.
      - name: Restore DB from data branch
        id: restore-db
        run: |
          mkdir -p data
          if git ls-remote --heads origin data | grep -q "refs/heads/data"; then
            git fetch origin data --depth=1
            if git show origin/data:data/komik_db.jsonl > data/komik_db.jsonl 2>/dev/null; then
              LINES=$(wc -l < data/komik_db.jsonl)
              echo "[DB] Restored ${LINES} komik from data branch"
            else
              echo "[DB] data branch exists but no DB file found"
            fi
          else
            echo "[DB] No data branch yet, starting fresh"
          fi

      # ── Run smart update ──
      # max_age_minutes=380 (>360) gives 20min buffer for cron delay
      - name: Run smart update
        run: |
          mkdir -p data
          ./target/release/komikindo-scraper update \
            --max-pages 3 \
            --max-age-minutes 380 \
            --db

      # ── Push updated DB to data branch ──
      # Uses a separate worktree to avoid branch-switching issues.
      - name: Push DB to data branch
        run: |
          if [ ! -f data/komik_db.jsonl ]; then
            echo "[DB] No DB file produced — skipping push"
            exit 0
          fi

          # Save updated DB to temp
          cp data/komik_db.jsonl /tmp/komik_db.jsonl

          DB_SIZE=$(du -h /tmp/komik_db.jsonl | cut -f1)
          DB_LINES=$(wc -l < /tmp/komik_db.jsonl)
          echo "[DB] Updated: ${DB_SIZE}, ${DB_LINES} komik"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or update data branch
          if git ls-remote --heads origin data | grep -q "refs/heads/data"; then
            git fetch origin data
            git branch -f data origin/data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
            git branch -f data HEAD
          fi

          # Use worktree to avoid switching branches
          git worktree add /tmp/db-worktree data 2>/dev/null || \
            (git worktree remove /tmp/db-worktree --force 2>/dev/null; git worktree add /tmp/db-worktree data)

          # Copy DB into worktree
          mkdir -p /tmp/db-worktree/data
          cp /tmp/komik_db.jsonl /tmp/db-worktree/data/komik_db.jsonl

          # Commit and push
          cd /tmp/db-worktree
          git add data/komik_db.jsonl
          TIMESTAMP=$(date -u +%Y-%m-%d_%H:%M:%S)
          git commit -m "DB update ${TIMESTAMP} (${DB_LINES} komik)" \
            --allow-empty-message || echo "[DB] No changes to commit"
          git push origin data

          # Cleanup
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/db-worktree --force

          echo "[DB] Pushed to data branch successfully"

      # ── Summary ──
      - name: Summary
        if: always()
        run: |
          echo "=== Smart Update Summary ==="
          if [ -f data/komik_db.jsonl ]; then
            SIZE=$(du -h data/komik_db.jsonl | cut -f1)
            LINES=$(wc -l < data/komik_db.jsonl)
            echo "DB size: ${SIZE}"
            echo "Total komik: ${LINES}"
          else
            echo "No DB file produced"
          fi
          echo "Timestamp: $(date -u)"
