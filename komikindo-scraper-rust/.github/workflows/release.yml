# Build release binaries for amd64 and arm64 (Termux)
#
# This workflow builds the komikindo-scraper binary for multiple targets.
# arm64 uses QEMU emulation on GitHub Actions runners.
#
# Artifacts are uploaded as GitHub Release assets (manual trigger)
# or saved as workflow artifacts.

name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: komikindo-scraper-amd64
            apt_extra: ''
          - target: aarch64-unknown-linux-gnu
            artifact: komikindo-scraper-arm64
            apt_extra: 'gcc-aarch64-linux-gnu'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_extra }}

      # QEMU for arm64 cross-compilation
      - name: Setup QEMU (arm64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3

      - name: Generate Cargo.lock
        run: cargo generate-lockfile 2>/dev/null || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} 2>&1

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/komikindo-scraper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/komikindo-scraper

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: List binaries
        run: |
          echo "=== Release Binaries ==="
          ls -lh release/
          file release/komikindo-scraper-amd64/komikindo-scraper
          file release/komikindo-scraper-arm64/komikindo-scraper

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "KomikIndo Scraper ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## KomikIndo Scraper - Rust Release

            | File | Arch | Target |
            |------|------|--------|
            | `komikindo-scraper-amd64` | x86_64 | Linux (server/GitHub Actions) |
            | `komikindo-scraper-arm64` | aarch64 | Termux (Android ARM64) |

            ### Usage
            ```bash
            chmod +x komikindo-scraper-*
            # Full fetch
            ./komikindo-scraper-amd64 full-fetch --skip-chapters --limit 10
            # Smart update
            ./komikindo-scraper-amd64 update --max-pages 3
            ```
          files: |
            release/komikindo-scraper-amd64/komikindo-scraper
            release/komikindo-scraper-arm64/komikindo-scraper
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
