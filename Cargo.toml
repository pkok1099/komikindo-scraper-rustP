[package]
name = "komikindo-scraper"
version = "1.2.0-beta"
edition = "2021"
description = "KomikIndo scraper - Rust version for Termux"

[dependencies]
# Async runtime
# Only include needed tokio features — 'full' adds unused fs/net/process/signal/etc.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# HTTP client - curl untuk bypass Cloudflare
# static-curl = compile libcurl from source (no system lib needed)
# rustls = use rustls for TLS (no OpenSSL needed, works for cross-compile)
# default-features = false disables default 'ssl' feature (which needs system OpenSSL)
curl = { version = "0.4", default-features = false, features = ["static-curl", "http2", "rustls"] }

# HTML parsing
scraper = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI arguments
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"

# Logging
env_logger = "0.11"
log = "0.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# dotenv for .env support
dotenvy = "0.15"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "tls-rustls", "chrono"] }

# Lightweight Mutex — no poisoning checks, spin-then-park strategy
# ~30-50ns less overhead per lock/unlock vs std::sync::Mutex
parking_lot = "0.12"

# jemalloc for better allocation performance (5-15% improvement for allocation-heavy workloads)
# Only available on Linux/macOS, not on Windows or some embedded targets
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Faster dependency compilation while keeping main crate at opt-level 3
[profile.release.package."*"]
opt-level = 2
