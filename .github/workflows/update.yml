# KomikIndo Smart Update — runs every 6 hours
#
# Flow:
#   1. Build Rust binary (release, statically linked curl + rustls)
#   2. Run `komikindo-scraper update --db`
#   3. Upsert results to Supabase PostgreSQL
#
# All TLS: pure Rust (rustls) = ZERO system dependencies needed.

name: Smart Update

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on default branch (main) for scheduled runs
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    env:
      RUST_LOG: warn
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v6-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v6-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-v6-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-v6-

      # No system dependencies needed (all rustls, static-curl)
      - name: Build
        run: cargo build --release --locked 2>&1

      - name: Run smart update
        continue-on-error: true
        run: |
          ./target/release/komikindo-scraper update \
            --max-pages 3 \
            --max-age-minutes 380 \
            --db

      - name: Summary
        if: always()
        run: |
          echo "=== Smart Update Summary ==="
          echo "Timestamp: $(date -u)"
          echo "Note: Update may fail if komikindo.ch blocks datacenter IPs (Cloudflare)."
