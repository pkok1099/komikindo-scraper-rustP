# KomikIndo Smart Update — runs every 6 hours
#
# Flow:
#   1. Download pre-built binary from latest GitHub Release
#   2. Run `komikindo-scraper update --db`
#   3. Upsert results to Supabase PostgreSQL
#
# Why download instead of build?
#   - Code rarely changes between cron runs — no point rebuilding every 6h
#   - Download: ~2s | Build: ~3-5min → saves CI minutes & time
#   - Release binary is the exact same artifact (musl, static, rustls)

name: Smart Update

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on default branch (main) for scheduled runs
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    env:
      RUST_LOG: warn
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Download latest release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY="komikindo-scraper-amd64"
          echo "=== Downloading latest release binary ==="
          gh release download --repo pkok1099/komikindo-scraper-rust \
            --pattern "${BINARY}" \
            --output komikindo-scraper \
            --clobber
          chmod +x komikindo-scraper
          echo "=== Binary info ==="
          ls -lh komikindo-scraper
          file komikindo-scraper

      - name: Run smart update
        continue-on-error: true
        run: |
          ./komikindo-scraper update \
            --max-pages 3 \
            --max-age-minutes 380 \
            --db

      - name: Summary
        if: always()
        run: |
          echo "=== Smart Update Summary ==="
          echo "Timestamp: $(date -u)"
          echo "Note: Update may fail if komikindo.ch blocks datacenter IPs (Cloudflare)."
