# KomikIndo Smart Update — runs every 6 hours
#
# Flow:
#   1. Build Rust binary (release, statically linked curl + rustls)
#   2. Run `komikindo-scraper update --db`
#   3. Upsert results to Supabase PostgreSQL
#
# All TLS: pure Rust (rustls) = ZERO system dependencies needed.

name: Smart Update

on:
  schedule:
    # Every 6 hours (UTC) = 07:00, 13:00, 19:00, 01:00 WIB
  #  - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_LOG: warn
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rustls-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rustls-v2-

      # No system dependencies needed (all rustls, static-curl)
      - name: Build
        run: cargo build --release --locked 2>&1

      - name: Run smart update
        continue-on-error: true
        run: |
          ./target/release/komikindo-scraper update \
            --max-pages 3 \
            --max-age-minutes 380 \
            --db

      - name: Summary
        if: always()
        run: |
          echo "=== Smart Update Summary ==="
          echo "Timestamp: $(date -u)"
          echo "Note: Update may fail if komikindo.ch blocks datacenter IPs (Cloudflare)."
