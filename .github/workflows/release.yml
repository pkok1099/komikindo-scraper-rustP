# Build release binaries for amd64 (Linux) and Termux (Android)
#
# All TLS: pure Rust (rustls) = ZERO system dependencies needed.
# curl → rustls-ffi (static-curl), sqlx → tls-rustls.
#
# Targets:
#   - x86_64-unknown-linux-gnu    → Linux amd64 (Codespace/GitHub Actions)
#   - aarch64-linux-android       → Termux (Android ARM64) — STATIC binary

name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: komikindo-scraper-amd64
            apt_extra: ''
            rustflags: ''
          - target: aarch64-linux-android
            artifact: komikindo-scraper-termux
            apt_extra: ''
            rustflags: '-C target-feature=+crt-static'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK (Termux only)
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'

      - name: Set Android NDK env (Termux only)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=${{ matrix.rustflags }}" >> $GITHUB_ENV

      - name: Install system dependencies
        if: matrix.apt_extra != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_extra }}

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-registry-v6-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-registry-v6-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.target }}-cargo-target-v6-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-target-v6-

      - name: Build ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} --locked 2>&1

      - name: Strip binary
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              strip target/${{ matrix.target }}/release/komikindo-scraper
              ;;
            aarch64-linux-android)
              ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip target/${{ matrix.target }}/release/komikindo-scraper
              ;;
          esac

      - name: Show binary info
        run: |
          echo "=== ${{ matrix.target }} ==="
          ls -lh target/${{ matrix.target }}/release/komikindo-scraper
          file target/${{ matrix.target }}/release/komikindo-scraper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/komikindo-scraper

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: Flatten and rename binaries
        run: |
          # download-artifact@v4 creates: release/<artifact-name>/<binary>
          # We want: release/<artifact-name> (the binary itself, no subdirectory)
          # Cannot mv into same-named dir — must copy out, remove dir, then rename.
          cp release/komikindo-scraper-amd64/komikindo-scraper release/_amd64
          cp release/komikindo-scraper-termux/komikindo-scraper release/_termux
          rm -rf release/komikindo-scraper-amd64 release/komikindo-scraper-termux
          mv release/_amd64 release/komikindo-scraper-amd64
          mv release/_termux release/komikindo-scraper-termux

      - name: List binaries
        run: |
          echo "=== Release Binaries ==="
          ls -lh release/komikindo-scraper-*
          file release/komikindo-scraper-*

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "KomikIndo Scraper ${{ steps.tag.outputs.tag }}"
          body: |
            ## KomikIndo Scraper - Rust Release

            | File | Arch | Platform | Notes |
            |------|------|----------|-------|
            | `komikindo-scraper-amd64` | x86_64 | Linux (Codespace/GitHub Actions) | glibc |
            | `komikindo-scraper-termux` | aarch64 | **Termux (Android)** | **STATIC — no dependencies** |

            ### Which binary?

            - **Linux PC/Server/Codespace**: `komikindo-scraper-amd64`
            - **Termux on Android**: `komikindo-scraper-termux`

            ### Quick Start (Termux)

            ```bash
            pkg install ca-certificates
            wget -q https://github.com/pkok1099/komikindo-scraper-rust/releases/download/${{ steps.tag.outputs.tag }}/komikindo-scraper-termux
            chmod +x komikindo-scraper-termux
            echo "DATABASE_URL=postgresql://user:pass@host:5432/postgres" > .env
            ./komikindo-scraper-termux debug
            ```

            ### Quick Start (Linux)

            ```bash
            wget -q https://github.com/pkok1099/komikindo-scraper-rust/releases/download/${{ steps.tag.outputs.tag }}/komikindo-scraper-amd64
            chmod +x komikindo-scraper-amd64
            echo "DATABASE_URL=postgresql://user:pass@host:5432/postgres" > .env
            ./komikindo-scraper-amd64 debug
            ```
          files: |
            release/komikindo-scraper-amd64
            release/komikindo-scraper-termux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
