# SonarCloud configuration for komikindo-scraper-rust
# https://sonarcloud.io

sonar.host.url=https://sonarcloud.io
sonar.organization=pkok1099
sonar.projectKey=pkok1099_komikindo-scraper-rust
sonar.projectName=komikindo-scraper-rust
sonar.projectVersion=1.2.0-beta

# Source directories
sonar.sources=src
sonar.tests=tests,examples

# Language
sonar.language=rust

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — build artifacts, generated files, binary models, cached HTML
sonar.exclusions=\
  target/**,\
  models/**,\
  html_cache/**,\
  download/**,\
  lm/training_data.npz,\
  lm/*.onnx,\
  lm/*.json,\
  **/*.rs.bk

# Test exclusions
sonar.test.exclusions=\
  html_cache/**,\
  models/**,\
  target/**

# Coverage — cargo-tarpaulin output
sonar.rust.coverage.reportPath=target/tarpaulin/coverage.json

# Python training scripts (supplementary, not primary analysis)
sonar.python.version=3
